  setClientCapabilities(value: unknown) {
    const record = value && typeof value === "object" && !Array.isArray(value)
      ? value as Record<string, unknown>
      : {};
    const capabilities = Array.isArray(record.capabilities) ? record.capabilities : [];
    this.clientCapabilities = new Set(capabilities.map((item) => clean(item, 120)).filter(Boolean));
    this.sendClient({
      type: "gateway_status",
      status: "capabilities_applied",
      voiceUiCapabilityVersion: Number(record.version || 0),
      capabilities: Array.from(this.clientCapabilities),
    });
  }

  supportsClientCapability(name: string) {
    return this.clientCapabilities.has(name);
  }

  async handleActionGroupEdit(event: Record<string, unknown>) {
