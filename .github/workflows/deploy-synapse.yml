name: Validate and deploy Synapse and subscription Edge Functions

on:
  pull_request:
    paths:
      - "supabase/functions/synapse-*/**"
      - "supabase/functions/process-agenda-change-communications/**"
      - "supabase/functions/agenda-change-response/**"
      - "supabase/functions/gemini-text-chat/**"
      - "supabase/functions/neurozap-evolution/**"
      - "supabase/functions/whatsapp-send/**"
      - "supabase/functions/create-checkout-session/**"
      - "supabase/functions/get-current-entitlement/**"
      - "supabase/functions/verify-checkout-session/**"
      - "supabase/functions/continue-free-plan/**"
      - "supabase/functions/subscription-maintenance/**"
      - "supabase/functions/asaas-invoices/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/*synapse*.sql"
      - "supabase/migrations/*agenda*.sql"
      - "supabase/migrations/*neurozap*.sql"
      - "supabase/migrations/*subscription*.sql"
      - "supabase/migrations/*entitlement*.sql"
      - "supabase/config.toml"
      - ".github/workflows/deploy-synapse.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/synapse-*/**"
      - "supabase/functions/process-agenda-change-communications/**"
      - "supabase/functions/agenda-change-response/**"
      - "supabase/functions/gemini-text-chat/**"
      - "supabase/functions/neurozap-evolution/**"
      - "supabase/functions/whatsapp-send/**"
      - "supabase/functions/create-checkout-session/**"
      - "supabase/functions/get-current-entitlement/**"
      - "supabase/functions/verify-checkout-session/**"
      - "supabase/functions/continue-free-plan/**"
      - "supabase/functions/subscription-maintenance/**"
      - "supabase/functions/asaas-invoices/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/*synapse*.sql"
      - "supabase/migrations/*agenda*.sql"
      - "supabase/migrations/*neurozap*.sql"
      - "supabase/migrations/*subscription*.sql"
      - "supabase/migrations/*entitlement*.sql"
      - "supabase/config.toml"
      - ".github/workflows/deploy-synapse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synapse-subscription-edge-functions-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: krewdaklcyzqfxkkgvqr
  SUPABASE_CLI_VERSION: 2.109.1
  EDGE_FUNCTIONS: >-
    synapse-text-fallback
    gemini-text-chat
    synapse-text-gateway
    synapse-voice-agent-session
    synapse-voice-azure-tts
    synapse-voice-gateway
    synapse-voice-tool
    synapse-whatsapp-in
    neurozap-evolution
    whatsapp-send
    create-checkout-session
    get-current-entitlement
    verify-checkout-session
    continue-free-plan
    subscription-maintenance
    asaas-invoices
    process-agenda-change-communications
    agenda-change-response

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Type-check controlled Edge Functions
        shell: bash
        run: |
          for function_name in ${EDGE_FUNCTIONS}; do
            echo "Checking ${function_name}"
            deno check "supabase/functions/${function_name}/index.ts"
          done

      - name: Install npm packages required by Deno npm imports
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Edge Function tests without external side effects
        run: deno test --allow-read --frozen supabase/functions

  deploy_stage34_voice_sandbox:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/synapse-plan-stage2-action-group-runtime' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Type-check Stage 3/4 voice and agenda runtime
        run: |
          deno check supabase/functions/synapse-voice-tool/index.ts
          deno check supabase/functions/synapse-voice-agent-session/index.ts
          deno check supabase/functions/synapse-voice-gateway/index.ts
          deno check supabase/functions/process-agenda-change-communications/index.ts
          deno check supabase/functions/agenda-change-response/index.ts

      - name: Deploy Stage 3/4 runtime to Sandbox when authorized
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not configured; Sandbox deploy skipped after successful type-check."
            exit 0
          fi
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy synapse-voice-tool --project-ref "${SUPABASE_PROJECT_REF}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy synapse-voice-agent-session --project-ref "${SUPABASE_PROJECT_REF}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy synapse-voice-gateway --project-ref "${SUPABASE_PROJECT_REF}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy process-agenda-change-communications --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy agenda-change-response --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secret
        run: test -n "${SUPABASE_ACCESS_TOKEN:-}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy controlled Edge Functions
        shell: bash
        run: |
          for function_name in ${EDGE_FUNCTIONS}; do
            echo "Deploying ${function_name}"
            if [ "${function_name}" = "process-agenda-change-communications" ] || [ "${function_name}" = "agenda-change-response" ]; then
              npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy "${function_name}" --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}"
            else
              npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy "${function_name}" --project-ref "${SUPABASE_PROJECT_REF}"
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
