const normalizeReviewKey = (value: unknown) => String(value ?? "")
  .normalize("NFD")
  .replace(/[\\u0300-\\u036f]/g, "")
  .toLowerCase()
  .replace(/[^a-z0-9]+/g, " ")
  .trim();

async function replacePendingAction(admin: any, pending: PendingReference, nextAction: PendingAction) {
  const attachments = pending.attachments.map((item: any) =>
    item?.kind === "synapse_pending_action" && item?.actionId === pending.action.actionId ? nextAction : item
  );
  const { error } = await admin.from("messages").update({ attachments }).eq("id", pending.row.id);
  if (error) throw error;
}

