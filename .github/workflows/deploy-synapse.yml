        confirmation_required: Boolean(payload.confirmation_required),
        error: payload.error || undefined,
      });
    } catch (error) {
      this.sendClient({ type: "function_status", status: "failed", id, name: "edit_action_group", label: "Revisão do plano", message: "Não consegui aplicar essa edição à revisão atual.", error: clean(error instanceof Error ? error.message : error, 800) });
