name: Validate and deploy NeuroFinance reconciliation

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/asaas-financial-sync/**"
      - "supabase/functions/_shared/asaas-client.ts"
      - "supabase/functions/_shared/neurofinance-financial.ts"
      - "supabase/functions/_shared/financial-management.ts"
      - "supabase/functions/_shared/subscription-access.ts"
      - "supabase/config.toml"
      - ".github/workflows/deploy-asaas-financial-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurofinance-financial-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: krewdaklcyzqfxkkgvqr
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Type-check NeuroFinance reconciliation
        run: deno check supabase/functions/asaas-financial-sync/index.ts

      - name: Deploy NeuroFinance reconciliation when authorized
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not configured; deploy skipped after successful type-check."
            exit 0
          fi
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy asaas-financial-sync --no-verify-jwt --project-ref "${SUPABASE_PROJECT_REF}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
