name: Temporary patient payment status patch

on:
  push:
    branches:
      - agent/fix-patient-payment-status
    paths:
      - .github/workflows/temp-fix-patient-payment-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-patient-payment-status
          fetch-depth: 0

      - name: Apply narrow patient payment status fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("supabase/functions/synapse-text-fallback/executor-v3.ts")
          text = path.read_text()
          old = "      const charges = account.has_account\n        ? await queryCharges(admin, userId, { ...args, status, limit }, false)\n        : [];\n"
          new = "      let charges: any[] = [];\n      if (account.has_account) {\n        let chargeQuery = admin\n          .from(\"nb_payments\")\n          .select(\"id,patient_id,appointment_id,gross_amount,net_amount,status,normalized_status,funds_status,payment_method_type,expires_at,paid_at,created_at,description,checkout_url,provider_payment_id,metadata\")\n          .eq(\"user_id\", userId)\n          .eq(\"patient_id\", args.patient_id)\n          .order(\"created_at\", { ascending: false });\n\n        if (status && status !== \"all\") {\n          chargeQuery = chargeQuery.eq(\"normalized_status\", status === \"overdue\" ? \"overdue\" : status);\n        }\n        chargeQuery = chargeQuery.limit(limit);\n\n        const { data: chargeRows, error: chargeError } = await chargeQuery;\n        if (chargeError) throw chargeError;\n        charges = (chargeRows || []).map((row: any) => ({\n          ...mapCharge(row),\n          patient_name: args.patient_name || null,\n        }));\n      }\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one target block, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "neuronex-ai-agent"
          git config user.email "agent@users.noreply.github.com"
          git add supabase/functions/synapse-text-fallback/executor-v3.ts
          git commit -m "fix(synapse): repair patient payment status lookup"
          git push origin HEAD:agent/fix-patient-payment-status
