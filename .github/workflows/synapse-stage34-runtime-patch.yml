name: Patch Synapse stage 3/4 runtime bridge

on:
  push:
    branches:
      - agent/synapse-plan-stage2-action-group-runtime
    paths:
      - .github/workflows/synapse-stage34-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/synapse-plan-stage2-action-group-runtime
          fetch-depth: 0

      - name: Patch runtime bridge
        shell: python
        run: |
          from pathlib import Path

          gateway = Path('supabase/functions/synapse-voice-gateway/index.ts')
          text = gateway.read_text()

          old = '''  private pendingConfirmation: PendingConfirmation | null = null;
  private lastInterruptionAt = 0;
  private queue: Promise<void> = Promise.resolve();
'''
          new = '''  private pendingConfirmation: PendingConfirmation | null = null;
  private clientCapabilities = new Set<string>();
  private lastInterruptionAt = 0;
  private queue: Promise<void> = Promise.resolve();
'''
          assert old in text, 'runner fields anchor missing'
          text = text.replace(old, new, 1)

          old = '''    this.invokeTool = options.invokeTool;
  }

  handleClientActionResult(event: Record<string, unknown>) {
'''
          new = '''    this.invokeTool = options.invokeTool;
  }

  setClientCapabilities(value: unknown) {
    const record = value && typeof value === "object" && !Array.isArray(value)
      ? value as Record<string, unknown>
      : {};
    const capabilities = Array.isArray(record.capabilities) ? record.capabilities : [];
    this.clientCapabilities = new Set(
      capabilities.map((item) => clean(item, 120)).filter(Boolean),
    );
    this.sendClient({
      type: "gateway_status",
      status: "capabilities_applied",
      voiceUiCapabilityVersion: Number(record.version || 0),
      capabilities: Array.from(this.clientCapabilities),
    });
  }

  supportsClientCapability(name: string) {
    return this.clientCapabilities.has(name);
  }

  handleClientActionResult(event: Record<string, unknown>) {
'''
          assert old in text, 'runner constructor anchor missing'
          text = text.replace(old, new, 1)

          old = '''    if (!name) return;
    if (!this.claimCall(id, name, args)) return;

    const controller = new AbortController();
'''
          new = '''    if (!name) return;
    if (!this.claimCall(id, name, args)) return;

    if (
      name === "prepare_action_group" &&
      (!this.supportsClientCapability("action_group:v1") ||
        !this.supportsClientCapability("review_action:v1"))
    ) {
      const message = "O navegador conectado não suporta a revisão assistida necessária para executar este grupo com segurança.";
      this.sendFunctionResponse(id, name, {
        ok: false,
        tool: name,
        spoken_summary: message,
        message,
        retryable: false,
        needs_clarification: false,
        confirmation_required: false,
        error: message,
        error_code: "voice_ui_capability_missing",
      }, thoughtSignature);
      this.sendClient({
        type: "gateway_warning",
        errorType: "capability_error",
        error: message,
      });
      return;
    }

    if (
      name === "confirm_pending_action" &&
      this.pendingConfirmation?.opaque &&
      !this.supportsClientCapability("opaque_confirmation:v1")
    ) {
      const message = "A confirmação protegida não está disponível neste navegador; a ação não foi executada.";
      this.sendFunctionResponse(id, name, {
        ok: false,
        tool: name,
        spoken_summary: message,
        message,
        retryable: false,
        confirmation_required: true,
        error: message,
        error_code: "opaque_confirmation_capability_missing",
      }, thoughtSignature);
      this.sendClient({
        type: "gateway_warning",
        errorType: "capability_error",
        error: message,
      });
      return;
    }

    const controller = new AbortController();
'''
          assert old in text, 'runFunction capability anchor missing'
          text = text.replace(old, new, 1)

          old = '''      if (result?.clientAction) {
        const clientActionResult = await this.awaitClientAction(task, result.clientAction);
        if (controller.signal.aborted) throw makeAbortError();
        Object.assign(payload, applyClientActionResult(name, payload, clientActionResult));
      }
'''
          new = '''      if (result?.clientAction) {
        const protocolAction = result.clientAction && typeof result.clientAction === "object"
          ? result.clientAction as Record<string, any>
          : null;
        if (protocolAction?.type === "synapse_action_review") {
          if (!this.supportsClientCapability("review_action:v1")) {
            const message = "A revisão visual obrigatória não está disponível neste navegador; a ação não foi executada.";
            Object.assign(payload, {
              ok: false,
              spoken_summary: message,
              message,
              retryable: false,
              error: message,
              error_code: "review_action_capability_missing",
            });
          } else {
            const reviewData = protocolAction.data && typeof protocolAction.data === "object"
              ? protocolAction.data as Record<string, any>
              : {};
            const reviewActions = Array.isArray(reviewData.actions) ? reviewData.actions : [];
            payload.review = {
              step_count: reviewActions.length,
              areas: reviewActions.map((item: any) => clean(item?.area, 120)).filter(Boolean),
            };
            this.sendClient({ type: "review_action", action: protocolAction });
          }
        } else {
          const clientActionResult = await this.awaitClientAction(task, result.clientAction);
          if (controller.signal.aborted) throw makeAbortError();
          Object.assign(payload, applyClientActionResult(name, payload, clientActionResult));
        }
      }
'''
          assert old in text, 'clientAction bridge anchor missing'
          text = text.replace(old, new, 1)

          old = '''    if (!this.authorization) throw new Error("Sessao ausente para iniciar voz.");

    const sessionConfig = await this.fetchSessionConfig(payload);
'''
          new = '''    if (!this.authorization) throw new Error("Sessao ausente para iniciar voz.");

    this.runner.setClientCapabilities(payload.voiceUiCapabilities);

    const sessionConfig = await this.fetchSessionConfig(payload);
'''
          assert old in text, 'session capability anchor missing'
          text = text.replace(old, new, 1)

          old = '''  injectUserMessage(message: unknown) {
    const text = clean(message, 2000);
    if (!text) return;
    this.sendDeepgram({ type: "InjectUserMessage", message: text });
  }
'''
          new = '''  injectUserMessage(message: unknown) {
    const text = clean(message, 2000);
    if (!text) return;
    this.sendDeepgram({ type: "InjectUserMessage", content: text });
  }
'''
          assert old in text, 'InjectUserMessage anchor missing'
          text = text.replace(old, new, 1)
          gateway.write_text(text)

          hook = Path('src/hooks/use-deepgram-agent-voice.ts')
          text = hook.read_text()
          old = 'const DEFAULT_GATEWAY_URL = "ws://localhost:8789/v1/synapse/voice";\n\n'
          new = '''const DEFAULT_GATEWAY_URL = "ws://localhost:8789/v1/synapse/voice";
const VOICE_UI_CAPABILITIES = {
  version: 1,
  capabilities: [
    "action_group:v1",
    "review_action:v1",
    "opaque_confirmation:v1",
    "screen_context:v1",
  ],
} as const;

'''
          assert old in text, 'hook capability constant anchor missing'
          text = text.replace(old, new, 1)

          old = '''            voiceUiCapabilities: {
              version: 1,
              capabilities: ["review_action:v1", "opaque_confirmation:v1", "screen_context:v1"],
            },
'''
          new = '''            voiceUiCapabilities: VOICE_UI_CAPABILITIES,
'''
          assert old in text, 'hook start capability anchor missing'
          text = text.replace(old, new, 1)
          hook.write_text(text)

          workflow = Path('.github/workflows/synapse-stage34-runtime-patch.yml')
          workflow.unlink()

      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/synapse-voice-gateway/index.ts src/hooks/use-deepgram-agent-voice.ts .github/workflows/synapse-stage34-runtime-patch.yml
          git commit -m "Close Edge review protocol and capability handshake"
          git push origin HEAD:agent/synapse-plan-stage2-action-group-runtime
